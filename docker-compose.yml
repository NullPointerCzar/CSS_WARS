services:
  postgres:
    image: postgres:16-alpine
    container_name: cssbattle-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: cssbattle
      POSTGRES_PASSWORD: cssbattle_dev
      POSTGRES_DB: cssbattle
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
